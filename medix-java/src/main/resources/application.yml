server:
  port: 8080

spring:
  mvc:
    # DeepSeek's streamed final polish can legitimately exceed the MVC default 30-second async timeout.
    async:
      request-timeout: 180s
  config:
    import:
      - optional:classpath:agents/agent-constraints.yml
      - optional:classpath:agents/swarm-constraints.yml
      - optional:file:./application-local.yml
  application:
    name: medix-java
  datasource:
    url: ${MEDIX_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${MEDIX_DB_USERNAME:postgres}
    password: ${MEDIX_DB_PASSWORD:123456}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${MEDIX_REDIS_HOST:localhost}
      port: ${MEDIX_REDIS_PORT:6379}
      password: ${MEDIX_REDIS_PASSWORD:123321}
  ai:
    openai:
      api-key: ${MEDIX_OPENAI_API_KEY:}
      base-url: ${MEDIX_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${MEDIX_OPENAI_MODEL:deepseek-v4-flash}
          temperature: ${MEDIX_OPENAI_TEMPERATURE:0.2}
          top-p: ${MEDIX_OPENAI_TOP_P:0.9}

management:
  health:
    redis:
      enabled: ${MEDIX_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

medix:
  security:
    production: ${MEDIX_PRODUCTION:false}
    jwt-secret: ${MEDIX_JWT_SECRET:dev-only-change-this-secret-32bytes}
    jwt-ttl-seconds: ${MEDIX_JWT_TTL_SECONDS:28800}
  nlu:
    # Local Ollama intent classification is enabled by default. Set
    # MEDIX_NLU_ENABLED=false only when an explicit LeadAgent fallback is needed.
    enabled: ${MEDIX_NLU_ENABLED:true}
    base-url: ${MEDIX_NLU_BASE_URL:http://localhost:11434}
    # Qwen first rewrites the contextual retrieval query, then classifies intent/risk for routing.
    # Professional agents themselves remain on the separately configured DeepSeek API channel.
    model: ${MEDIX_NLU_MODEL:qwen3.5:9b}
    timeout: ${MEDIX_NLU_TIMEOUT:20s}
    confidence-threshold: ${MEDIX_NLU_CONFIDENCE_THRESHOLD:0.70}
    label-threshold: ${MEDIX_NLU_LABEL_THRESHOLD:0.55}
    ambiguity-margin: ${MEDIX_NLU_AMBIGUITY_MARGIN:0.10}
    risk-threshold: ${MEDIX_NLU_RISK_THRESHOLD:0.30}
  agent:
    engine: ${MEDIX_AGENT_ENGINE:agentscope}
    max-iterations: 5
    max-skill-calls: 3
    single-agent-timeout: 15s
    swarm-timeout: 30s
  memory:
    redis-context-ttl: ${MEDIX_REDIS_CONTEXT_TTL:2h}
    entropy:
      enabled: ${MEDIX_MEMORY_ENTROPY_ENABLED:true}
      recent-message-limit: ${MEDIX_MEMORY_RECENT_MESSAGE_LIMIT:10}
      medium-message-threshold: ${MEDIX_MEMORY_MEDIUM_MESSAGE_THRESHOLD:20}
      high-message-threshold: ${MEDIX_MEMORY_HIGH_MESSAGE_THRESHOLD:50}
      duplicate-rate-threshold: ${MEDIX_MEMORY_DUPLICATE_RATE_THRESHOLD:0.2}
      average-length-threshold: ${MEDIX_MEMORY_AVERAGE_LENGTH_THRESHOLD:1000}
  features:
    live-llm: ${MEDIX_LIVE_LLM:true}
    redis: ${MEDIX_REDIS_ENABLED:false}
    minio: ${MEDIX_MINIO_ENABLED:false}
    reranker: ${MEDIX_RERANKER_ENABLED:true}
    vector-store: ${MEDIX_VECTOR_STORE_ENABLED:false}
  rag:
    enabled: ${MEDIX_RAG_ENABLED:true}
    rerank-min-score: ${MEDIX_RAG_RERANK_MIN_SCORE:0.70}
    embedding:
      base-url: ${MEDIX_RAG_EMBEDDING_URL:http://localhost:11434}
      model: ${MEDIX_RAG_EMBEDDING_MODEL:bge-m3}
      dimensions: ${MEDIX_RAG_EMBEDDING_DIMENSIONS:1024}
      timeout: ${MEDIX_RAG_EMBEDDING_TIMEOUT:15s}
    import-file: ${MEDIX_RAG_IMPORT_FILE:}
    import-batch-size: ${MEDIX_RAG_IMPORT_BATCH_SIZE:200}
  services:
    reranker-url: ${MEDIX_RERANKER_URL:http://localhost:8081/rerank}
    minio-endpoint: ${MEDIX_MINIO_ENDPOINT:http://localhost:9000}
    minio-access-key: ${MEDIX_MINIO_ACCESS_KEY:minioadmin}
    minio-secret-key: ${MEDIX_MINIO_SECRET_KEY:minioadmin123}
